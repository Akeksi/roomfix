name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pip install -e .[dev]
      - name: Get CamillaDSP (checks that exported configs behave exactly like the built-in renderer)
        run: |
          curl -sSL https://github.com/HEnquist/camilladsp/releases/download/v4.1.3/camilladsp-linux-amd64.tar.gz | tar xz
          echo "CAMILLADSP=$PWD/camilladsp" >> "$GITHUB_ENV"
      - run: pytest -q

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev] pyinstaller
      - run: pytest -q
      - run: pyinstaller --onefile --name roomfix --add-data "roomfix/web;roomfix/web" --collect-all sounddevice --collect-all _sounddevice_data run.py
      - run: dist\roomfix.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: roomfix-windows
          path: dist/roomfix.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/roomfix.exe
