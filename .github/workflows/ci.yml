name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pip install -e .[dev]
      - name: Get CamillaDSP (checks that exported configs behave exactly like the built-in renderer)
        run: |
          curl -sSL https://github.com/HEnquist/camilladsp/releases/download/v4.1.3/camilladsp-linux-amd64.tar.gz | tar xz
          echo "CAMILLADSP=$PWD/camilladsp" >> "$GITHUB_ENV"
      - run: pytest -q

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev] pyinstaller
      - run: pytest -q
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build roomfix.exe and the installer
        run: python packaging/build.py
      - name: Check roomfix.exe in demo mode (page, API, logo, a measurement)
        run: python packaging/smoke.py dist/roomfix/roomfix.exe
      - uses: actions/upload-artifact@v4
        with:
          name: roomfix-windows
          path: |
            dist/roomfix-setup-*.exe
            dist/roomfix-*-portable.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/roomfix-setup-*.exe
            dist/roomfix-*-portable.zip
          body_path: packaging/release-notes.md
